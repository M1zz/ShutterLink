<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShutterLink 리모컨</title>
  <meta name="apple-itunes-app" content="app-clip-bundle-id=com.devkoan.shutterlink.Clip, app-clip-display=card">
  <style>
    body{font-family:-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#1c1a33;color:#fff}
    .card{max-width:360px;margin:20px;text-align:center}
    img{width:96px;border-radius:22px}
    h1{font-size:22px;margin:16px 0 8px}
    p{color:#b9b6cf;font-size:16px;line-height:1.5;word-break:keep-all}
  </style>
</head>
<body>
  <div class="card">
    <img src="../icon.png" alt="">
    <h1>ShutterLink 리모컨</h1>
    <p>iPhone 기본 카메라로 카메라 폰의 QR 코드를 스캔하면 설치 없이 바로 리모컨이 열립니다.</p>
  </div>
</body>
</html>
