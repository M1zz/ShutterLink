<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27306b"/>
      <stop offset="0.32" stop-color="#7a4f8f"/>
      <stop offset="0.52" stop-color="#e98a6a"/>
      <stop offset="0.62" stop-color="#ffc58a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a77b"/>
      <stop offset="0.35" stop-color="#a5617f"/>
      <stop offset="1" stop-color="#3a2d5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffd59a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb47a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a4a"/>
      <stop offset="1" stop-color="#140f22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1430"/>
      <stop offset="1" stop-color="#2c1f40"/>
    </linearGradient>
  </defs>

  <rect width="900" height="760" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.7">
    <circle cx="120" cy="90" r="2.2"/><circle cx="300" cy="150" r="1.6"/><circle cx="520" cy="70" r="2"/>
    <circle cx="700" cy="130" r="1.8"/><circle cx="820" cy="60" r="1.4"/><circle cx="60" cy="220" r="1.4"/>
    <circle cx="610" cy="210" r="1.3"/><circle cx="410" cy="40" r="1.5"/>
  </g>
  <!-- soft clouds -->
  <g fill="#ffd1b0" opacity="0.35">
    <ellipse cx="200" cy="430" rx="190" ry="22"/>
    <ellipse cx="690" cy="470" rx="230" ry="18"/>
    <ellipse cx="560" cy="380" rx="140" ry="12"/>
  </g>

  <circle cx="450" cy="600" r="320" fill="url(#glow)"/>
  <circle cx="450" cy="590" r="80" fill="#fff3d2"/>

  <!-- mountains -->
  <path d="M0 640 L120 560 L210 610 L330 520 L430 600 L520 545 L640 620 L760 540 L900 610 L900 760 L0 760 Z" fill="#8a557f" opacity="0.75"/>
  <path d="M0 690 L90 650 L190 690 L300 630 L400 690 L560 640 L690 700 L820 650 L900 680 L900 760 L0 760 Z" fill="#5e3f6e"/>

  <!-- lake -->
  <rect y="752" width="900" height="300" fill="url(#lake)"/>
  <g fill="#fff3d2" opacity="0.75">
    <rect x="380" y="770" width="140" height="6" rx="3"/>
    <rect x="400" y="792" width="100" height="5" rx="2.5"/>
    <rect x="360" y="814" width="180" height="5" rx="2.5" opacity="0.6"/>
    <rect x="415" y="838" width="70" height="4" rx="2"/>
    <rect x="390" y="862" width="120" height="4" rx="2" opacity="0.5"/>
  </g>

  <!-- foreground ground / dock -->
  <path d="M0 980 C 200 950, 700 950, 900 985 L900 1200 L0 1200 Z" fill="url(#ground)"/>

  <!-- friends, silhouetted against the sunset -->
  <g fill="url(#rim)">
    <!-- 1: hands on hips -->
    <g transform="translate(210 0)">
      <circle cx="0" cy="742" r="27"/>
      <rect x="-34" y="776" width="68" height="150" rx="30"/>
      <path d="M-30 790 L-64 850 L-36 900 L-26 884 L-44 852 L-20 812 Z"/>
      <path d="M30 790 L64 850 L36 900 L26 884 L44 852 L20 812 Z"/>
      <rect x="-28" y="900" width="22" height="120" rx="10"/>
      <rect x="6" y="900" width="22" height="120" rx="10"/>
    </g>
    <!-- 2: jumping, arms up -->
    <g transform="translate(375 -60) rotate(-6 0 880)">
      <circle cx="0" cy="740" r="26"/>
      <rect x="-32" y="772" width="64" height="146" rx="29"/>
      <rect x="-14" y="640" width="20" height="140" rx="10" transform="rotate(-28 -4 780)"/>
      <rect x="-6" y="640" width="20" height="140" rx="10" transform="rotate(28 4 780)"/>
      <rect x="-28" y="896" width="21" height="110" rx="10" transform="rotate(14 -18 900)"/>
      <rect x="7" y="896" width="21" height="110" rx="10" transform="rotate(-24 18 900)"/>
    </g>
    <!-- 3: peace sign -->
    <g transform="translate(525 8)">
      <circle cx="0" cy="740" r="25"/>
      <rect x="-31" y="772" width="62" height="142" rx="28"/>
      <rect x="-12" y="660" width="19" height="130" rx="9" transform="rotate(30 0 790)"/>
      <rect x="-34" y="790" width="19" height="118" rx="9" transform="rotate(10 -24 790)"/>
      <rect x="-26" y="890" width="21" height="114" rx="10"/>
      <rect x="5" y="890" width="21" height="114" rx="10"/>
    </g>
    <!-- 4: waving -->
    <g transform="translate(690 -4)">
      <circle cx="0" cy="744" r="27"/>
      <rect x="-34" y="778" width="68" height="150" rx="30"/>
      <rect x="18" y="664" width="20" height="132" rx="10" transform="rotate(22 28 796)"/>
      <rect x="-38" y="792" width="20" height="124" rx="10" transform="rotate(8 -28 792)"/>
      <rect x="-28" y="902" width="22" height="120" rx="10"/>
      <rect x="6" y="902" width="22" height="120" rx="10"/>
    </g>
  </g>
</svg>
